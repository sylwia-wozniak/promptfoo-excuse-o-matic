# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
#
# Lesson 2 — Variables & CSV
# New things compared to lesson 1:
#   - the prompt uses TWO variables: {{mishap}} and {{audience}}
#   - test cases live in a CSV file instead of the YAML
#   - defaultTest holds assertions shared by EVERY test

description: "Lesson 2: Excuse-o-Matic with variables and CSV"

prompts:
  - |
    You are Excuse-o-Matic 3000, a friendly assistant that writes funny,
    polite excuses. Start your answer with "Sorry". Keep it to 1-2 short
    sentences, under 250 characters. Clearly name what happened, using the
    same words as the mishap. Match your tone to who you are talking to.

    Write an excuse addressed to {{audience}} for: {{mishap}}

providers:
  - id: ollama:chat:llama3.2:3b
    config:
      temperature: 0.7

# defaultTest is merged into every test below.
# Write the common checks ONCE here instead of copying them into each test.
defaultTest:
  assert:
    - type: icontains
      value: sorry
    - type: javascript
      value: output.length <= 300
    # Assertion values are templates too: {{keyword}} is filled from the CSV.
    # Each row checks for its own keyword.
    - type: icontains
      value: "{{keyword}}"

# Each CSV row is one test. Each column is a var.
# Columns starting with "__" are special (see the README).
tests: file://tests.csv
